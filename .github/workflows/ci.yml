name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run type-check

      # No live database is available in CI yet — the one Phase 0 test
      # (.env.example drift guard) doesn't need one. Once Phase 3 adds
      # integration tests against Postgres, add a `postgres:` service here.
      - run: npm run test

      - run: npm run build

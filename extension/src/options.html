<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cielo settings</title>
    <style>
      /* Mirrors the Cielo tokens in app/globals.css — the extension ships
         standalone, so it cannot import them. Keep the two in step. */
      :root {
        --ink: #f7f7f8;
        --surface: #ffffff;
        --divider: #ebebed;
        --text: #1f1f22;
        --muted: #6b6b70;
        --accent: #95ff00;
        --accent-contrast: #212121;
        --accent-strong: #3f6e00;
        --danger: #c02626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 420px;
        margin: 0;
        padding: 22px 24px 24px;
        background: var(--surface);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        line-height: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input {
        width: 100%;
        height: 44px;
        padding: 0 16px;
        border: 1px solid var(--divider);
        border-radius: 50px;
        background: var(--ink);
        color: var(--text);
        font: inherit;
        font-size: 14px;
      }

      input:focus-visible {
        outline: 2px solid var(--accent-strong);
        outline-offset: 2px;
      }

      .button {
        display: flex;
        height: 44px;
        width: 100%;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50px;
        background: var(--accent);
        color: var(--accent-contrast);
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }

      .button:hover {
        filter: brightness(0.95);
      }

      .footnote {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 17px;
      }

      .footnote.error {
        color: var(--danger);
      }

      .footnote.ok {
        color: var(--accent-strong);
      }

      .link-button {
        align-self: flex-start;
        border: 0;
        background: none;
        padding: 0;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .link-button:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <form id="settings">
      <h1>Cielo settings</h1>

      <div>
        <label for="api-base-url">Your Cielo address</label>
        <input
          id="api-base-url"
          name="apiBaseUrl"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="cielo.app"
        />
      </div>

      <p class="footnote">
        Where saving, importing and the login check go. Use your own deployment,
        or a local dev server while you are building.
      </p>

      <button class="button" type="submit">Save</button>
      <button class="link-button" type="button" id="reset">Reset to the default</button>

      <p class="footnote" id="status" role="status" aria-live="polite"></p>
    </form>

    <script type="module" src="options.js"></script>
  </body>
</html>
